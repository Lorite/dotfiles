# aw-server-rust (central store) + aw-sync (imports the laptop's Syncthing'd
# buckets) for the home server, deployable in Coolify.
#
# SECURITY: aw-server has NO auth and NO HTTPS. Do NOT give this a public domain
# in Coolify. Access only over Tailscale — the port below is bound to the
# server's Tailscale IP (100.72.103.27), not 0.0.0.0.
services:
  aw-server:
    build:
      context: .
      args:
        AW_VERSION: v0.13.2
    restart: unless-stopped
    command: ["--host", "0.0.0.0", "--port", "5600"]
    volumes:
      - aw-data:/data
    # --- Access mode: PUBLIC domain via Coolify/Traefik (aw.lorite.eu + Basic Auth) ---
    # Set AW_BASIC_AUTH in Coolify (env var) to the output of:
    #   htpasswd -nbB <user> '<password>'        # the whole "user:hash" line
    # The label only references ${AW_BASIC_AUTH}, so the hash never lands in this public
    # repo. `https` / `letsencrypt` are Coolify's default Traefik entrypoint + resolver.
    labels:
      - traefik.enable=true
      - 'traefik.http.routers.aw.rule=Host(`aw.lorite.eu`)'
      - traefik.http.routers.aw.entrypoints=https
      - traefik.http.routers.aw.tls.certresolver=letsencrypt
      - traefik.http.services.aw.loadbalancer.server.port=5600
      - 'traefik.http.middlewares.aw-auth.basicauth.users=${AW_BASIC_AUTH}'
      - traefik.http.routers.aw.middlewares=aw-auth
    # --- Alternative: Tailscale-only (no domain, no auth). To use this instead, delete
    #     the labels above and uncomment the binding below (aw-server has no auth/HTTPS,
    #     so this IP must be the server's Tailscale IP, never 0.0.0.0): ---
    # ports:
    #   - "100.72.103.27:5600:5600"

  aw-sync:
    build:
      context: .
      args:
        AW_VERSION: v0.13.2
    restart: unless-stopped
    # Share aw-server's network namespace so aw-sync reaches it on 127.0.0.1.
    # This deliberately avoids inter-container DNS/routing, which some hosts block
    # via firewall (verified: the loopback path works where aw-server:5600 timed out).
    network_mode: "service:aw-server"
    entrypoint: ["aw-sync"]
    command: ["--host", "127.0.0.1", "--port", "5600", "--sync-dir", "/sync", "daemon"]
    volumes:
      # Host path where Syncthing delivers the laptop's ~/ActivityWatchSync.
      # Set this to the real folder on the server (Coolify: persistent storage / bind mount).
      - /home/lorite/ActivityWatchSync:/sync
    depends_on:
      - aw-server

volumes:
  aw-data:
