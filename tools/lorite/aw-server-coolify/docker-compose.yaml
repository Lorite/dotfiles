# aw-server-rust (central store) + aw-sync (imports the laptop's Syncthing'd
# buckets) for the home server, deployable in Coolify.
#
# SECURITY: aw-server has NO auth and NO HTTPS. Do NOT give this a public domain
# in Coolify. Access only over Tailscale — the port below is bound to the
# server's Tailscale IP (100.72.103.27), not 0.0.0.0.
services:
  aw-server:
    build:
      context: .
      args:
        AW_VERSION: v0.13.2
    restart: unless-stopped
    command: ["--host", "0.0.0.0", "--port", "5600"]
    environment:
      # aw-server-rust 403s any request carrying an Origin it doesn't allow, which behind
      # a real domain is every XHR the web UI makes ("AxiosError: ... status code 403").
      # The entrypoint turns this into config.toml's `cors = [...]` on every start.
      # Keep it to the exact origin(s) you serve from — not a wildcard.
      AW_CORS_ORIGINS: "https://aw.lorite.eu"
    volumes:
      - aw-data:/data
    # --- Access mode: PUBLIC domain via Coolify/Traefik (aw.lorite.eu + Basic Auth) ---
    # Set the domain in the Coolify UI (Domains -> https://aw.lorite.eu, port 5600).
    # Coolify then auto-generates the router, service and TLS labels itself; we only
    # attach the auth middleware here.
    #
    # The middleware itself is defined in Traefik's FILE provider on the server
    # (/data/coolify/proxy/dynamic/aw.yaml), installed by ./install-traefik-auth.sh.
    # Two reasons it lives there and not here:
    #   1. This repo is public — the bcrypt line must never be committed.
    #   2. Coolify escapes `$` when it re-emits the compose file, so a `${VAR}` in a
    #      label is NEVER interpolated. The previous
    #      `...basicauth.users=${AW_BASIC_AUTH}` reached Traefik as the *literal*
    #      string, which failed with `error parsing BasicUser: ${AW_BASIC_AUTH}`.
    #      Setting the env var in Coolify does not and cannot fix that.
    #
    # FAIL-CLOSED BY DESIGN: if aw.yaml is missing, `aw-auth@file` does not resolve and
    # Traefik drops the router (503) instead of serving the dashboard without a login.
    # Never replace this with a middleware that can silently succeed as a no-op.
    #
    # NOTE: do NOT re-add `traefik.http.routers.aw.*` / `traefik.http.services.aw.*`
    # here. Coolify's generated services then make three services for one router and
    # Traefik refuses to link it: "Router aw cannot be linked automatically with
    # multiple Services".
    labels:
      - traefik.enable=true
      - traefik.http.routers.aw.middlewares=aw-auth@file
    # --- Alternative: Tailscale-only (no domain, no auth). To use this instead, delete
    #     the labels above and uncomment the binding below (aw-server has no auth/HTTPS,
    #     so this IP must be the server's Tailscale IP, never 0.0.0.0): ---
    # ports:
    #   - "100.72.103.27:5600:5600"

  aw-sync:
    build:
      context: .
      args:
        AW_VERSION: v0.13.2
    restart: unless-stopped
    # Share aw-server's network namespace so aw-sync reaches it on 127.0.0.1.
    # This deliberately avoids inter-container DNS/routing, which some hosts block
    # via firewall (verified: the loopback path works where aw-server:5600 timed out).
    network_mode: "service:aw-server"
    entrypoint: ["aw-sync"]
    command: ["--host", "127.0.0.1", "--port", "5600", "--sync-dir", "/sync", "daemon"]
    volumes:
      # Host path where Syncthing delivers the laptop's ~/ActivityWatchSync.
      # Set this to the real folder on the server (Coolify: persistent storage / bind mount).
      - /home/lorite/ActivityWatchSync:/sync
    depends_on:
      - aw-server

volumes:
  aw-data:
