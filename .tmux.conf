# Tmux Configuration

# Improve colors
set -g default-terminal "screen-256color"

# Dracula theme
set -g @plugin 'dracula/tmux'

# Set scrollback buffer to 10000
set -g history-limit 10000

# Change prefix from Ctrl-b to Ctrl-a
# 2026-08-11: reverted to the default Ctrl-b prefix (Alejandro: keep defaults
# so tutorials, docs and AI instructions work verbatim). Kept commented, not
# deleted, per the comment-out convention.
# unbind C-b
# set -g prefix C-a
# bind C-a send-prefix

# Start window numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Enable mouse support
set -g mouse on

# Split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Reload config file
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Vim-like pane navigation
# bind h select-pane -L
# bind j select-pane -D
# bind k select-pane -U
# bind l select-pane -R

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Don't rename windows automatically
set -g allow-rename off

# Status bar styling
set -g status-position bottom
set -g status-bg colour234
set -g status-fg colour137
set -g status-left ''
set -g status-right '#[fg=colour233,bg=colour241,bold] %d/%m #[fg=colour233,bg=colour245,bold] %H:%M:%S '
set -g status-right-length 50
set -g status-left-length 20

# Current window highlighting
setw -g window-status-current-format ' #I#[fg=colour250]:#[fg=colour255]#W#[fg=colour50]#F '
setw -g window-status-format ' #I#[fg=colour237]:#[fg=colour250]#W#[fg=colour244]#F '

# Activity monitoring
setw -g monitor-activity on
set -g visual-activity off

# Pane borders
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour51

# Message text
set -g message-style bg=colour235,fg=colour166

# Copy mode vim-like
# setw -g mode-keys vi
# bind-key -T copy-mode-vi 'v' send -X begin-selection
# bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel

# Increase display time for messages
set -g display-time 2000

# No delay for escape key press
set -sg escape-time 0

# Enable focus events for terminal vim integration
set -g focus-events on
