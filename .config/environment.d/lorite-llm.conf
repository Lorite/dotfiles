# lorite-llm defaults — sourced by lorite-llm.sh to pick the headless LLM client.
# Set LLM_CLIENT and/or LLM_MODEL here to override auto-detection.
# Omitted values let lorite-llm.sh use its built-in defaults (antigravity, then opencode,
# then Claude with the "sonnet" alias).
#
# This file is a TEMPLATE: install.sh copies it only when ~/.config/environment.d/ has
# no copy yet, so per-machine edits are never overwritten. The values below stay
# commented out on purpose — a fresh machine keeps the auto-detected default.
#
# Reload after editing: `systemctl --user daemon-reload` (verified 2026-07-31 to be
# enough for user units to pick up new values; confirm with
# `systemctl --user show-environment | grep -i llm`).
#
# HOME SERVER (lorite-thinkcentre-m720q) runs with all three set. Since 2026-09-15:
#     LLM_CLIENT=antigravity
#     LLM_MODEL=gemini-3.1-pro-high
#     LLM_EFFORT=high
# It ran LLM_CLIENT=claude / claude-sonnet-5 / xhigh from 2026-07-31 to 2026-09-15.
# The full model name is pinned rather than a floating alias so a future release cannot
# silently change what the nightly jobs run.
#
# LLM_EFFORT ranges differ per client and this matters: Claude takes low|medium|high|xhigh|max,
# Antigravity only low|medium|high. lorite-llm.sh CLAMPS xhigh/max to high for Antigravity
# (clamp_effort) because agy otherwise exits immediately with
# `invalid --effort "xhigh" (valid: low, medium, high)` — which would have failed every nightly
# job at launch on the day the server switched. OpenCode has no equivalent and ignores it.
# Unset means the client's own default. Higher effort means slower, more thorough runs — fine
# for nightly jobs with no one waiting, and the reason the briefing's --max-turns headroom matters.
#
# Pinning LLM_CLIENT chooses the PRIMARY client only. Since 2026-07-31 a pinned client still
# falls back when it fails (the retry drops LLM_MODEL, which is client-specific), so a quota
# limit no longer fails the job outright — that failure mode is what killed the 2026-07-20
# morning briefing. Since 2026-09-15 the retry walks the whole remaining chain in
# CLIENT_ORDER (antigravity -> opencode -> claude) instead of one hardcoded partner, so a job
# survives two clients failing. Set LLM_FALLBACK=0 to fail instead of retrying, which is the
# right choice for a job where a weaker client's answer would be misleading rather than merely
# worse (see lorite-morning-briefing.service's security-audit note).
#
# LLM_CLIENT=antigravity
# LLM_MODEL=gemini-3.1-pro-high
