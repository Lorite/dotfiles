# lorite-llm defaults — sourced by lorite-llm.sh to pick the headless LLM client.
# Set LLM_CLIENT and/or LLM_MODEL here to override auto-detection.
# Omitted values let lorite-llm.sh use its built-in defaults (opencode, then Claude
# with the "sonnet" alias).
#
# This file is a TEMPLATE: install.sh copies it only when ~/.config/environment.d/ has
# no copy yet, so per-machine edits are never overwritten. The values below stay
# commented out on purpose — a fresh machine keeps the OpenCode-first default.
#
# Reload after editing: `systemctl --user daemon-reload` (verified 2026-07-31 to be
# enough for user units to pick up new values; confirm with
# `systemctl --user show-environment | grep -i llm`).
#
# HOME SERVER (lorite-thinkcentre-m720q) runs with all three set, since 2026-07-31:
#     LLM_CLIENT=claude
#     LLM_MODEL=claude-sonnet-5
#     LLM_EFFORT=xhigh
# The full model name is pinned rather than the "sonnet" alias so a future Sonnet
# release cannot silently change what the nightly jobs run. LLM_EFFORT is Claude-only
# (--effort: low|medium|high|xhigh|max); unset means the client's own default from
# ~/.claude/settings.json. Higher effort means slower, more thorough runs — fine for
# nightly jobs with no one waiting, and the reason the briefing's --max-turns headroom
# matters. OpenCode has no equivalent, so the value is ignored there.
#
# Pinning LLM_CLIENT chooses the PRIMARY client only. Since 2026-07-31 a pinned client still
# falls back to the other one when it fails (the retry drops LLM_MODEL, which is client-
# specific), so a Claude quota limit no longer fails the job outright — that failure mode is
# what killed the 2026-07-20 morning briefing. Set LLM_FALLBACK=0 to fail instead of retrying,
# which is the right choice for a job where a weaker client's answer would be misleading
# rather than merely worse (see lorite-morning-briefing.service's security-audit note).
#
# LLM_CLIENT=opencode
# LLM_MODEL=openclaw
